# ── PBFT Node Configuration ──────────────────────────────────────────────────
#
# Override any property on the command line:
#   java -jar pbft.jar --node.id=1 --server.port=8081 --node.signature-scheme=DILITHIUM

# Which node am I? (0 = primary)
node.id=0

# Total nodes — must satisfy n = 3f + 1
node.total=10

# Comma-separated peer base URLs (index = node id)
node.peers=http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085,http://localhost:8086,http://localhost:8087,http://localhost:8088,http://localhost:8089

# Signature scheme: ECDSA  or  DILITHIUM
# ALL nodes must use the same value
node.signature-scheme=ECDSA

# Transport: REST  or  TCP
node.transport=TCP
# TCP port (REST port + 1000 by convention)
node.tcp-port=9080

# How long /propose blocks waiting for COMMIT quorum (milliseconds)
# Increase if nodes are on separate machines with higher network latency
node.commit-timeout=10000

# Spring
server.port=8080
spring.application.name=pbft-node

# Increase Tomcat thread pool so concurrent PBFT messages don't queue
server.tomcat.threads.max=50

logging.level.com.pbft=DEBUG

# Break circular dependency: nodeConfig -> tcpServer -> signatureVerifier -> nodeConfig
spring.main.allow-circular-references=true
